name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Windows x64 build and package
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Check source and version
        run: |
          python scripts/check_repo.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/version.py --check-tag "$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Prepare pinned dependencies
        run: python scripts/prepare.py
      - name: Install build dependencies
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip install -r requirements-build.txt
      - name: Build runtime, add-on and tests
        run: ./scripts/build.ps1 -Jobs 4
      - name: Package and verify
        run: |
          python scripts/package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_package.py --expected-commit "$env:GITHUB_SHA"
      - name: Upload portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build/*.log
            build/*results.txt
            build/build-info.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'brpjerry/eldenringrt-freefps'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-${{ github.sha }}
          path: dist
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
